<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
    <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotating Octahedron with Physics</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        #container {
            width: 100vw;
            height: 100vh;
        }
        #info {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            background: rgba(0, 0, 0, 0.6);
            padding: 15px 20px;
            border-radius: 10px;
            font-size: 14px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <div id="info">
        🔮 Rotating Octahedron Physics Sim<br>
        <small>3 balls bouncing with gravity</small>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        let scene, camera, renderer, octahedron, balls = [];
        const BALL_COUNT = 3;
        const GRAVITY = 0.00098; // Realistic gravity acceleration
        const DAMPING = 0.995; // Air resistance
        const RESTITUTION = 0.85; // Energy retention on bounce
        const BALL_RADIUS = 0.12;
        const OCTA_SIZE = 2;

        function init() {
            // Scene setup
            scene = new THREE.Scene();
            scene.fog = new THREE.Fog(0x0f0c29, 5, 15);
            
            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(4, 3, 5);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('container').appendChild(renderer.domElement);

            // Create octahedron structure
            createOctahedron();
            
            // Create balls with initial velocities
            createBalls();

            // Enhanced lighting
            const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
            scene.add(ambientLight);
            
            const pointLight1 = new THREE.PointLight(0x00ffff, 1, 100);
            pointLight1.position.set(5, 5, 5);
            pointLight1.castShadow = true;
            scene.add(pointLight1);
            
            const pointLight2 = new THREE.PointLight(0xff00ff, 0.8, 100);
            pointLight2.position.set(-5, -3, -5);
            scene.add(pointLight2);

            window.addEventListener('resize', onWindowResize);
        }

        function createOctahedron() {
            const geometry = new THREE.OctahedronGeometry(OCTA_SIZE, 0);
            
            // Wireframe edges
            const edges = new THREE.EdgesGeometry(geometry);
            const lineMaterial = new THREE.LineBasicMaterial({ 
                color: 0x00ffff, 
                linewidth: 2,
                transparent: true,
                opacity: 0.8
            });
            octahedron = new THREE.LineSegments(edges, lineMaterial);
            scene.add(octahedron);

            // Semi-transparent faces
            const faceMaterial = new THREE.MeshPhongMaterial({ 
                color: 0x1a4d7a, 
                transparent: true, 
                opacity: 0.12,
                side: THREE.DoubleSide,
                shininess: 100
            });
            const mesh = new THREE.Mesh(geometry, faceMaterial);
            octahedron.add(mesh);

            // Extract face data for collision detection
            extractFaceData(geometry);
        }

        function extractFaceData(geometry) {
            const positions = geometry.attributes.position.array;
            const indices = geometry.index.array;
            
            octahedron.userData.faces = [];
            
            for (let i = 0; i < indices.length; i += 3) {
                const i1 = indices[i] * 3;
                const i2 = indices[i + 1] * 3;
                const i3 = indices[i + 2] * 3;
                
                const v1 = new THREE.Vector3(positions[i1], positions[i1 + 1], positions[i1 + 2]);
                const v2 = new THREE.Vector3(positions[i2], positions[i2 + 1], positions[i2 + 2]);
                const v3 = new THREE.Vector3(positions[i3], positions[i3 + 1], positions[i3 + 2]);
                
                // Calculate face normal
                const edge1 = new THREE.Vector3().subVectors(v2, v1);
                const edge2 = new THREE.Vector3().subVectors(v3, v1);
                const normal = new THREE.Vector3().crossVectors(edge1, edge2).normalize();
                
                // Calculate face center and distance from origin
                const center = new THREE.Vector3()
                    .add(v1).add(v2).add(v3)
                    .divideScalar(3);
                const d = center.dot(normal);
                
                octahedron.userData.faces.push({ v1, v2, v3, normal, d });
            }
        }

        function createBalls() {
            const geometry = new THREE.SphereGeometry(BALL_RADIUS, 32, 32);
            const colors = [0xff3366, 0x33ff66, 0x3366ff];
            
            for (let i = 0; i < BALL_COUNT; i++) {
                const material = new THREE.MeshPhongMaterial({ 
                    color: colors[i],
                    shininess: 100,
                    specular: 0x444444
                });
                const ball = new THREE.Mesh(geometry, material);
                ball.castShadow = true;
                ball.receiveShadow = true;
                
                // Start at center with small random velocity
                ball.position.set(0, 0, 0);
                ball.userData.velocity = new THREE.Vector3(
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.03,
                    (Math.random() - 0.5) * 0.03
                );
                
                scene.add(ball);
                balls.push(ball);
            }
        }

        function updatePhysics(deltaTime) {
            const rotationMatrix = new THREE.Matrix4().makeRotationFromQuaternion(octahedron.quaternion);
            const inverseRotation = new THREE.Matrix4().copy(rotationMatrix).invert();
            
            balls.forEach(ball => {
                // Convert velocity to octahedron's local space
                const localVelocity = ball.userData.velocity.clone().applyMatrix4(inverseRotation);
                
                // Apply gravity in local space (downward in world becomes rotated in local)
                const worldGravity = new THREE.Vector3(0, -GRAVITY, 0);
                const localGravity = worldGravity.applyMatrix4(inverseRotation);
                localVelocity.add(localGravity);
                
                // Convert back to world space
                ball.userData.velocity.copy(localVelocity).applyMatrix4(rotationMatrix);
                
                // Apply damping
                ball.userData.velocity.multiplyScalar(DAMPING);
                
                // Update position
                ball.position.add(ball.userData.velocity);
                
                // Check collisions with each face
                checkCollisions(ball);
            });
        }

        function checkCollisions(ball) {
            const localPos = ball.position.clone().applyMatrix4(
                new THREE.Matrix4().makeRotationFromQuaternion(octahedron.quaternion).invert()
            );
            
            octahedron.userData.faces.forEach(face => {
                // Distance from point to plane
                const distance = localPos.dot(face.normal) - face.d;
                
                // Check if ball intersects this face
                if (Math.abs(distance) < BALL_RADIUS) {
                    // Project velocity onto normal
                    const worldNormal = face.normal.clone().applyQuaternion(octahedron.quaternion);
                    const velocityDotNormal = ball.userData.velocity.dot(worldNormal);
                    
                    // Only bounce if moving toward the face
                    if (velocityDotNormal < 0) {
                        // Reflect velocity
                        const reflection = worldNormal.clone().multiplyScalar(
                            velocityDotNormal * (1 + RESTITUTION)
                        );
                        ball.userData.velocity.sub(reflection);
                        
                        // Push ball outside the face
                        const penetration = BALL_RADIUS - Math.abs(distance);
                        const correction = worldNormal.clone().multiplyScalar(
                            penetration * Math.sign(distance)
                        );
                        ball.position.add(correction);
                    }
                }
            });
        }

        function animate() {
            requestAnimationFrame(animate);

            // Rotate octahedron
            octahedron.rotation.x += 0.008;
            octahedron.rotation.y += 0.012;
            octahedron.rotation.z += 0.004;

            // Update physics
            updatePhysics(0.016);

            renderer.render(scene, camera);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        init();
        animate();
    </script>
</body>
</html>
    
</body>
</html>
